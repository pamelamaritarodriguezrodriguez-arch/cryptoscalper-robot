name: CryptoScalper Robot

on:
  schedule:
    - cron: "*/10 * * * *"     # cada ~10 min (GitHub puede demorar algo, es normal)
  workflow_dispatch:            # permite ejecutarlo a mano con un botón

permissions:
  contents: write               # para guardar el estado y no repetir alertas

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ejecutar robot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID:   ${{ secrets.CHAT_ID }}
          SYMBOLS:   ${{ vars.SYMBOLS }}
          STRICT:    ${{ vars.STRICT }}
        run: node robot.js
      - name: Guardar estado
        run: |
          git config user.name  "scalper-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          git commit -m "estado [skip ci]" || echo "sin cambios"
          git push || echo "push omitido"
