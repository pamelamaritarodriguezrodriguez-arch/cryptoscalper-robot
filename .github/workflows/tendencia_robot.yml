name: Robot Tendencia 55-20

on:
  schedule:
    - cron: "20 0 * * *"        # cada día tras el cierre de la vela diaria (00:20 UTC)
    - cron: "20 3 * * *"        # respaldo por si GitHub se salta la primera (no repite nada)
  workflow_dispatch:            # también a mano con el botón "Run workflow"

permissions:
  contents: write               # para guardar la cartera virtual (tendencia_state.json)

concurrency:
  group: tendencia
  cancel-in-progress: false

jobs:
  tendencia:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Ejecutar robot de tendencia
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID:   ${{ secrets.CHAT_ID }}
          SYMBOLS:   ${{ vars.SYMBOLS }}
          CAPITAL:   ${{ vars.CAPITAL }}
        run: node tendencia_robot.js
      - name: Guardar cartera
        run: |
          git config user.name  "tendencia-bot"
          git config user.email "bot@users.noreply.github.com"
          git add tendencia_state.json || true
          git commit -m "tendencia estado [skip ci]" || echo "sin cambios"
          git pull --rebase origin ${GITHUB_REF_NAME} || true
          git push || echo "::warning::⚠️ No se pudo guardar la cartera"
